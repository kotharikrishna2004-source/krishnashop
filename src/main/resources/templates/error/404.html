<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html-head('Page Not Found - 404')}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="py-5 text-center">
    <div class="container py-5">
        <i class="bi bi-compass fs-1 text-warning mb-3 d-block" style="font-size: 4rem !important;"></i>
        <h1 class="fw-bold display-4">404</h1>
        <h3 class="fw-bold mb-3">Looking for something?</h3>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'We\'re sorry. The Web address you entered is not a functioning page on our site.'}">Page not found.</p>
        
        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/}" class="btn btn-ks-yellow px-4">Go to Krishna Shop's Home Page</a>
            <a th:href="@{/products}" class="btn btn-outline-secondary px-4">Browse All Products</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
