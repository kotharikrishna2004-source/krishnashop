<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/header :: html-head('Internal Server Error')}"></head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<main class="py-5 text-center">
    <div class="container py-5">
        <i class="bi bi-exclamation-octagon text-danger mb-3 d-block" style="font-size: 4rem !important;"></i>
        <h1 class="fw-bold display-5">Something went wrong</h1>
        <p class="text-muted mb-4" th:text="${errorMessage != null ? errorMessage : 'An unexpected error occurred while processing your request. Please try again later.'}"></p>
        
        <div class="d-flex justify-content-center gap-3">
            <a th:href="@{/}" class="btn btn-ks-yellow px-4">Back to Home</a>
            <a th:href="@{/cart}" class="btn btn-outline-secondary px-4">View Cart</a>
        </div>
    </div>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
