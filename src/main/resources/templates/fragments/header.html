<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="html-head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' | Krishna Shop'">Krishna Shop</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header th:fragment="header">
    <!-- Top Amazon-Style Navbar -->
    <div class="ks-navbar-top">
        <div class="container-fluid px-lg-4">
            <div class="d-flex align-items-center justify-content-between gap-3">
                <!-- Brand Logo -->
                <a th:href="@{/}" class="ks-brand-logo">
                    <i class="bi bi-shop feather-icon"></i>
                    <span>KRISHNA<span class="logo-accent">SHOP</span></span>
                </a>

                <!-- Deliver To Location -->
                <div class="ks-deliver-box d-none d-md-flex">
                    <i class="bi bi-geo-alt fs-5"></i>
                    <div>
                        <div class="sub-text">Deliver to</div>
                        <div class="main-text">India</div>
                    </div>
                </div>

                <!-- Search Bar with Category Dropdown -->
                <form th:action="@{/products}" method="get" class="ks-search-form d-none d-sm-flex">
                    <div class="input-group w-100">
                        <select name="categoryId" class="form-select ks-search-select">
                            <option value="">All Categories</option>
                            <option th:each="cat : ${allCategories}"
                                    th:value="${cat.id}"
                                    th:text="${cat.name}"
                                    th:selected="${selectedCategoryId != null && selectedCategoryId == cat.id}">
                                Electronics
                            </option>
                        </select>
                        <input type="text" name="keyword" th:value="${keyword}"
                               class="form-control ks-search-input"
                               placeholder="Search Krishna Shop (e.g. iPhone, Shoes, Air Fryer, Books)..."
                               aria-label="Search">
                        <button class="btn ks-search-btn" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>

                <!-- Navigation Links / User Auth -->
                <div class="d-flex align-items-center gap-2">
                    <!-- If Logged In -->
                    <div sec:authorize="isAuthenticated()" class="dropdown">
                        <a class="ks-nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                            <span class="nav-line-1">Hello, <span sec:authentication="name">User</span></span>
                            <span class="nav-line-2">Account & Lists</span>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end shadow">
                            <li><h6 class="dropdown-header">Your Account</h6></li>
                            <li><a class="dropdown-item" th:href="@{/orders}"><i class="bi bi-box-seam me-2"></i>My Orders</a></li>
                            <li sec:authorize="hasAuthority('ROLE_ADMIN')">
                                <hr class="dropdown-divider">
                            </li>
                            <li sec:authorize="hasAuthority('ROLE_ADMIN')">
                                <a class="dropdown-item fw-bold text-primary" th:href="@{/admin}">
                                    <i class="bi bi-speedometer2 me-2"></i>Admin Dashboard
                                </a>
                            </li>
                            <li><hr class="dropdown-divider"></li>
                            <li>
                                <form th:action="@{/logout}" method="post" class="px-2">
                                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                    <button type="submit" class="btn btn-outline-danger btn-sm w-100">
                                        <i class="bi bi-box-arrow-right me-1"></i>Sign Out
                                    </button>
                                </form>
                            </li>
                        </ul>
                    </div>

                    <!-- If Not Logged In -->
                    <div sec:authorize="isAnonymous()">
                        <a th:href="@{/login}" class="ks-nav-link">
                            <span class="nav-line-1">Hello, Sign In</span>
                            <span class="nav-line-2">Account & Lists</span>
                        </a>
                    </div>

                    <!-- Orders Link -->
                    <a th:href="@{/orders}" class="ks-nav-link d-none d-lg-flex">
                        <span class="nav-line-1">Returns</span>
                        <span class="nav-line-2">& Orders</span>
                    </a>

                    <!-- Shopping Cart Button -->
                    <a th:href="@{/cart}" class="ks-cart-btn">
                        <i class="bi bi-cart3 fs-3"></i>
                        <span class="ks-cart-badge" th:text="${cartItemCount != null ? cartItemCount : 0}">0</span>
                        <span class="d-none d-md-inline fw-bold ms-1">Cart</span>
                    </a>
                </div>
            </div>

            <!-- Mobile Search Bar -->
            <div class="d-sm-none mt-2">
                <form th:action="@{/products}" method="get">
                    <div class="input-group">
                        <input type="text" name="keyword" th:value="${keyword}"
                               class="form-control"
                               placeholder="Search Krishna Shop...">
                        <button class="btn btn-warning" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Secondary Subnav -->
    <div class="ks-subnav">
        <div class="container-fluid px-lg-4">
            <div class="d-flex align-items-center gap-3 overflow-x-auto text-nowrap py-1">
                <a th:href="@{/products}"><i class="bi bi-list me-1"></i><strong>All Products</strong></a>
                <a th:href="@{/products(sortBy='newest')}">New Arrivals</a>
                <a th:href="@{/products(sortBy='rating')}">Best Sellers</a>
                <a th:href="@{/products(inStockOnly=true)}">In Stock Today</a>
                <span class="text-white-50">|</span>
                <span th:each="cat : ${allCategories}">
                    <a th:href="@{/products(categoryId=${cat.id})}" th:text="${cat.name}">Category</a>
                </span>
                <span sec:authorize="hasAuthority('ROLE_ADMIN')" class="ms-auto">
                    <a th:href="@{/admin}" class="badge bg-warning text-dark text-decoration-none">
                        <i class="bi bi-shield-lock me-1"></i>Admin Panel
                    </a>
                </span>
            </div>
        </div>
    </div>
</header>

</body>
</html>
