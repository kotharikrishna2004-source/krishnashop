<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products Management | Krishna Shop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">

<div class="admin-wrapper">
    <!-- Sidebar -->
    <aside th:replace="~{fragments/admin-nav :: admin-sidebar('products')}"></aside>

    <div class="admin-content">
        <!-- Header -->
        <header th:replace="~{fragments/admin-nav :: admin-header('Product Inventory')}"></header>

        <main class="admin-main">
            <!-- Alerts -->
            <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="admin-table-card">
                <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
                    <div>
                        <h5 class="fw-bold mb-1">Catalog Products</h5>
                        <p class="text-muted small mb-0">Total <span th:text="${products.size()}">0</span> products in database</p>
                    </div>
                    <a th:href="@{/admin/products/new}" class="btn btn-warning fw-bold text-dark">
                        <i class="bi bi-plus-circle me-1"></i>Add New Product
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle admin-table">
                        <thead class="table-light">
                            <tr>
                                <th>Photo</th>
                                <th>Product Details</th>
                                <th>Category</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Badges</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${products.isEmpty()}">
                                <td colspan="7" class="text-center py-5 text-muted">No products found. Click "Add New Product" to create one.</td>
                            </tr>
                            <tr th:each="product : ${products}">
                                <td>
                                    <img th:src="${product.imageUrl != null ? product.imageUrl : 'https://placehold.co/100x100?text=Product'}"
                                         class="thumb" th:alt="${product.name}">
                                </td>
                                <td>
                                    <div class="fw-bold" th:text="${product.name}">Product Name</div>
                                    <small class="text-muted" th:text="'ID: #' + ${product.id} + ' | Rating: ' + ${product.rating} + '★'"></small>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${product.category != null ? product.category.name : 'Uncategorized'}">Category</span>
                                </td>
                                <td>
                                    <div class="fw-bold" th:text="'₹' + ${#numbers.formatDecimal(product.price, 0, 'COMMA', 2, 'POINT')}">₹1,499.00</div>
                                    <small class="text-muted text-decoration-line-through" th:if="${product.discountPrice != null && product.discountPrice > product.price}"
                                           th:text="'₹' + ${#numbers.formatDecimal(product.discountPrice, 0, 'COMMA', 2, 'POINT')}"></small>
                                </td>
                                <td>
                                    <span th:if="${product.stockQuantity > 5}" class="badge bg-success" th:text="${product.stockQuantity} + ' in stock'">In stock</span>
                                    <span th:if="${product.stockQuantity > 0 && product.stockQuantity <= 5}" class="badge bg-warning text-dark" th:text="${product.stockQuantity} + ' left (Low)'">Low stock</span>
                                    <span th:if="${product.stockQuantity == 0}" class="badge bg-danger">Out of stock</span>
                                </td>
                                <td>
                                    <span class="badge bg-warning text-dark me-1" th:if="${product.bestSeller}">Best Seller</span>
                                    <span class="badge bg-info text-dark me-1" th:if="${product.trending}">Trending</span>
                                    <span class="badge bg-primary me-1" th:if="${product.newArrival}">New</span>
                                    <span class="badge bg-secondary" th:if="${product.featured}">Featured</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex gap-1">
                                        <a th:href="@{/admin/products/edit/{id}(id=${product.id})}" class="btn btn-outline-primary btn-sm" title="Edit">
                                            <i class="bi bi-pencil-square"></i>
                                        </a>
                                        <form th:action="@{/admin/products/delete/{id}(id=${product.id})}" method="post"
                                              onsubmit="return confirm('Are you sure you want to delete this product?');">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-outline-danger btn-sm" title="Delete">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
