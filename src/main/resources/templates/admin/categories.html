<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories Management | Krishna Shop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">

<div class="admin-wrapper">
    <!-- Sidebar -->
    <aside th:replace="~{fragments/admin-nav :: admin-sidebar('categories')}"></aside>

    <div class="admin-content">
        <!-- Header -->
        <header th:replace="~{fragments/admin-nav :: admin-header('Product Categories')}"></header>

        <main class="admin-main">
            <!-- Alerts -->
            <div th:if="${successMessage != null}" class="alert alert-success alert-dismissible fade show">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${successMessage}">Success</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>
            <div th:if="${errorMessage != null}" class="alert alert-danger alert-dismissible fade show">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}">Error</span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <div class="admin-table-card">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h5 class="fw-bold mb-1">Catalog Categories</h5>
                        <p class="text-muted small mb-0">Organize your store catalog into main categories</p>
                    </div>
                    <a th:href="@{/admin/categories/new}" class="btn btn-warning fw-bold text-dark">
                        <i class="bi bi-plus-circle me-1"></i>Add New Category
                    </a>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle admin-table">
                        <thead class="table-light">
                            <tr>
                                <th>Photo</th>
                                <th>Category Name</th>
                                <th>Description</th>
                                <th>Products</th>
                                <th class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${categories.isEmpty()}">
                                <td colspan="5" class="text-center py-5 text-muted">No categories found. Click "Add New Category" to create one.</td>
                            </tr>
                            <tr th:each="cat : ${categories}">
                                <td>
                                    <img th:src="${cat.imageUrl != null ? cat.imageUrl : 'https://placehold.co/100x100?text=Cat'}"
                                         class="thumb" th:alt="${cat.name}">
                                </td>
                                <td>
                                    <strong class="text-dark" th:text="${cat.name}">Category Name</strong>
                                    <div class="small text-muted" th:text="'ID: #' + ${cat.id}">ID: #1</div>
                                </td>
                                <td class="text-muted small" th:text="${cat.description}" style="max-width: 350px;">Description</td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${cat.products != null ? cat.products.size() : 0} + ' items'">0 items</span>
                                </td>
                                <td class="text-end">
                                    <div class="d-inline-flex gap-1">
                                        <a th:href="@{/admin/categories/edit/{id}(id=${cat.id})}" class="btn btn-outline-primary btn-sm" title="Edit">
                                            <i class="bi bi-pencil-square"></i>
                                        </a>
                                        <form th:action="@{/admin/categories/delete/{id}(id=${cat.id})}" method="post"
                                              onsubmit="return confirm('Deleting category will unassign associated products. Proceed?');">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-outline-danger btn-sm" title="Delete">
                                                <i class="bi bi-trash"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
