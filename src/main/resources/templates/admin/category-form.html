<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:if="${isEdit}">Edit Category | Krishna Shop Admin</title>
    <title th:unless="${isEdit}">Add New Category | Krishna Shop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">

<div class="admin-wrapper">
    <aside th:replace="~{fragments/admin-nav :: admin-sidebar('categories')}"></aside>

    <div class="admin-content">
        <header th:if="${isEdit}" th:replace="~{fragments/admin-nav :: admin-header('Edit Category')}"></header>
        <header th:unless="${isEdit}" th:replace="~{fragments/admin-nav :: admin-header('Create New Category')}"></header>

        <main class="admin-main">
            <div class="row justify-content-center">
                <div class="col-12 col-md-8 col-lg-6">
                    <div class="admin-table-card">
                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <h5 class="fw-bold mb-0" th:if="${isEdit}">Edit Category #<span th:text="${category.id}">1</span></h5>
                            <h5 class="fw-bold mb-0" th:unless="${isEdit}">New Category</h5>
                            <a th:href="@{/admin/categories}" class="btn btn-outline-secondary btn-sm">
                                <i class="bi bi-arrow-left me-1"></i>Back
                            </a>
                        </div>

                        <form th:action="@{/admin/categories/save}" th:object="${category}" method="post">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                            <input type="hidden" th:field="*{id}"/>

                            <div class="mb-3">
                                <label for="name" class="form-label fw-bold small">Category Name *</label>
                                <input type="text" id="name" th:field="*{name}" class="form-control" required
                                       placeholder="e.g. Smart Watches & Wearables">
                            </div>

                            <div class="mb-3">
                                <label for="imageUrl" class="form-label fw-bold small">Category Image URL</label>
                                <input type="url" id="imageUrl" th:field="*{imageUrl}" class="form-control"
                                       placeholder="https://images.unsplash.com/...">
                            </div>

                            <div class="mb-4">
                                <label for="description" class="form-label fw-bold small">Description</label>
                                <textarea id="description" th:field="*{description}" class="form-control" rows="3"
                                          placeholder="Short summary of products in this category"></textarea>
                            </div>

                            <div class="d-flex justify-content-end gap-2">
                                <a th:href="@{/admin/categories}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-warning fw-bold text-dark px-4">Save Category</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
