<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Customers | Krishna Shop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">

<div class="admin-wrapper">
    <aside th:replace="~{fragments/admin-nav :: admin-sidebar('customers')}"></aside>

    <div class="admin-content">
        <header th:replace="~{fragments/admin-nav :: admin-header('Registered Customers')}"></header>

        <main class="admin-main">
            <div class="admin-table-card">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div>
                        <h5 class="fw-bold mb-1">Customer Accounts</h5>
                        <p class="text-muted small mb-0">Total <span th:text="${customers.size()}">0</span> registered customer accounts</p>
                    </div>
                </div>

                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th># ID</th>
                                <th>Full Name</th>
                                <th>Email</th>
                                <th>Phone</th>
                                <th>Registered On</th>
                                <th>Orders Count</th>
                                <th>Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${customers.isEmpty()}">
                                <td colspan="7" class="text-center py-5 text-muted">No registered customers found.</td>
                            </tr>
                            <tr th:each="customer : ${customers}">
                                <td><strong th:text="'#' + ${customer.id}">#1</strong></td>
                                <td>
                                    <div class="fw-bold" th:text="${customer.fullName}">Customer Name</div>
                                </td>
                                <td>
                                    <i class="bi bi-envelope me-1 text-muted"></i>
                                    <span th:text="${customer.email}">customer@example.com</span>
                                </td>
                                <td>
                                    <i class="bi bi-telephone me-1 text-muted"></i>
                                    <span th:text="${customer.phone != null ? customer.phone : 'N/A'}">9876543210</span>
                                </td>
                                <td th:text="${customer.createdAt != null ? #temporals.format(customer.createdAt, 'dd MMM yyyy') : 'N/A'}">21 Nov 2026</td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${customer.orders != null ? customer.orders.size() : 0} + ' orders'">0 orders</span>
                                </td>
                                <td>
                                    <span th:if="${customer.enabled}" class="badge bg-success">Active</span>
                                    <span th:unless="${customer.enabled}" class="badge bg-danger">Disabled</span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
