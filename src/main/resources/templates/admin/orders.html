<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Orders | Krishna Shop Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body class="admin-body">

<div class="admin-wrapper">
    <aside th:replace="~{fragments/admin-nav :: admin-sidebar('orders')}"></aside>

    <div class="admin-content">
        <header th:replace="~{fragments/admin-nav :: admin-header('Order Fulfilment & Management')}"></header>

        <main class="admin-main">
            <!-- Filter Pills by Status -->
            <div class="d-flex flex-wrap gap-2 mb-4 bg-white p-3 rounded-3 shadow-sm border">
                <span class="small fw-bold text-muted align-self-center me-2">Filter by Status:</span>
                <a th:href="@{/admin/orders}" class="btn btn-sm"
                   th:classappend="${selectedStatus == null} ? 'btn-dark' : 'btn-outline-secondary'">
                    All Orders (<span th:text="${orders.size()}">0</span>)
                </a>
                <a th:each="st : ${statuses}"
                   th:href="@{/admin/orders(status=${st.name()})}"
                   class="btn btn-sm"
                   th:classappend="${selectedStatus != null && selectedStatus.name() == st.name()} ? 'btn-' + ${st.badgeClass} : 'btn-outline-secondary'"
                   th:text="${st.displayName}">
                    Pending
                </a>
            </div>

            <div class="admin-table-card">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Order #</th>
                                <th>Customer Name</th>
                                <th>Order Date</th>
                                <th>Items</th>
                                <th>Total</th>
                                <th>Payment</th>
                                <th>Order Status</th>
                                <th class="text-end">Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:if="${orders.isEmpty()}">
                                <td colspan="8" class="text-center py-5 text-muted">No orders match the selected filter.</td>
                            </tr>
                            <tr th:each="order : ${orders}">
                                <td><strong class="text-primary" th:text="${order.orderNumber}">KS-12345</strong></td>
                                <td>
                                    <div class="fw-bold" th:text="${order.recipientName}">Customer</div>
                                    <small class="text-muted" th:text="'Ph: ' + ${order.phoneNumber}"></small>
                                </td>
                                <td th:text="${order.formattedDate}">21 Nov 2026</td>
                                <td>
                                    <span class="badge bg-secondary" th:text="${order.totalItemCount} + ' items'">1 item</span>
                                </td>
                                <td class="fw-bold text-dark" th:text="'₹' + ${#numbers.formatDecimal(order.totalAmount, 0, 'COMMA', 2, 'POINT')}">₹1,499.00</td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${order.paymentMethod}">COD</span>
                                    <small class="d-block" th:classappend="${order.paymentStatus == 'Paid'} ? 'text-success' : 'text-muted'"
                                           th:text="'(' + ${order.paymentStatus} + ')'"></small>
                                </td>
                                <td>
                                    <span class="badge" th:classappend="'bg-' + ${order.orderStatus.badgeClass}"
                                          th:text="${order.orderStatus.displayName}">Pending</span>
                                </td>
                                <td class="text-end">
                                    <a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn btn-outline-primary btn-sm">
                                        <i class="bi bi-gear me-1"></i>Manage
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
